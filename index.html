<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- primary meta tags -->
    <title>Document</title>
    <meta name="title" content="wealthhome">
    <meta name="description" content="This is a real statewebsite by Mustafa">

    <!-- Favicon -->
    <link rel="stylesheet" href="">

    <!-- Google Font link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900 display=swap"
        rel="stylesheet">

    <!-- Google icon -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <!-- Custom Css -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="header" data-header>
        <div class="container">
            <!-- Logo -->
            <a href="" class="logo">
                <img src="assets/images/logo.png" alt="wealthome">
            </a>
            <!-- NavBar -->
            <nav class="navbar" data-navbar>
                <ul class="navbar-list">
                    <li>
                        <a href="#" class="navbar-link label-medium active">Home</a>
                    </li>
                    <li>
                        <a href="#" class="navbar-link label-medium">Rent</a>
                    </li>
                    <li>
                        <a href="#" class="navbar-link label-medium">Sell</a>
                    </li>
                    <li>
                        <a href="#" class="navbar-link label-medium">Buy</a>
                    </li>
                    <li>
                        <a href="#" class="navbar-link label-medium">About</a>
                    </li>
                </ul>

                <div class="navbar-wrapper">
                    <a href="#" class="btn-link label-medium">Login</a>
                    <a href="#" class="btn btn-fill label-medium">Get Started</a>
                </div>
            </nav>
            <!-- Menu Toggle for responsiveness -->
            <button class="nav-toggle-btn icon-btn" aria-label="toggle navbar" data-nav-toggler>
                <span class="material-symbols-outlined open">
                    menu
                </span>
                <span class="material-symbols-outlined close">
                    close
                </span>
            </button>
        </div>
    </header>

    <main>
        <article>
            <section class="hero">
                <div class="container">
                    <div class="hero-content">
                        <h1 class="headline-large hero-title">Find a place where you can be yourself.</h1>
                        <p class="body-large hero-text">
                            If you're looking for a place where you can be yourself, don't give up. Keep searching until
                            you find a place that feels like home.
                        </p>
                        <form action="./" method="get" class="search-bar">
                            <label class="search-item">
                                <span class="label-medium label">Want to</span>
                                <select name="want-to" class="search-item-field body-medium">
                                    <option value="buy" selected>Buy</option>
                                    <option value="sell" selected>Sell</option>
                                    <option value="rent" selected>Rent</option>
                                </select>
                                <span class="material-symbols-outlined">
                                    real_estate_agent
                                </span>
                            </label>

                            <label class="search-item">
                                <span class="label-medium label">Want to</span>
                                <select name="want-to" class="search-item-field body-medium">
                                    <option value="any" selected>Any</option>
                                    <option value="houses" selected>Houses</option>
                                    <option value="apartments" selected>Apartments</option>
                                    <option value="villa" selected>Villa</option>
                                    <option value="townhome" selected>Townhome</option>
                                    <option value="bungalow" selected>Bungalow</option>
                                    <option value="loft" selected>Loft</option>
                                </select>
                                <span class="material-symbols-outlined">
                                    gite
                                </span>
                            </label>

                            <label class="search-item">
                                <span class="label-medium label">Want to</span>
                                <input type="text" name="Location" placeholder="Street, City, Zip..."
                                    class="search-item-field body-medium">
                                <span class="material-symbols-outlined">
                                    location_on
                                </span>
                            </label>

                            <button type="submit" class="search-btn">
                                <span class="material-symbols-outlined">
                                    search
                                </span>
                                <span class="label-medium">Search</span>
                            </button>
                        </form>
                    </div>

                    <img src="/assets/images/hero.png" width="816" height="659" role="presentation" class="hero-banner">
                    <img src="/assets/images/bg-pattern.png" width="1240" height="840" role="presentation" class="big-pattern">
                </div>
            </section>
        </article>
    </main>


    <script src="assets/js/script.js"></script>
</body>

</html>
